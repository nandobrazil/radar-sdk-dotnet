name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - run: dotnet build -c Release
      - run: dotnet test tests/Oconde.Radar.Tests -c Release --no-build -f net8.0
      - run: dotnet test tests/Oconde.Radar.Tests -c Release --no-build -f net9.0
      - run: dotnet test tests/Oconde.Radar.AspNetCore.Tests -c Release --no-build -f net8.0
      - run: dotnet test tests/Oconde.Radar.AspNetCore.Tests -c Release --no-build -f net9.0
      - run: dotnet test tests/Oconde.Radar.Logging.Tests -c Release --no-build -f net8.0
      - run: dotnet test tests/Oconde.Radar.Logging.Tests -c Release --no-build -f net9.0
      - run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build -c Release
      - run: dotnet test tests/Oconde.Radar.Tests -c Release --no-build -f net48
      - run: dotnet test tests/Oconde.Radar.Tests -c Release --no-build -f net462
      - run: dotnet test tests/Oconde.Radar.Logging.Tests -c Release --no-build -f net462
