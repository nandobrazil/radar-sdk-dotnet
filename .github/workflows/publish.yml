name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Version matches the tag
        run: test "v$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" = "${GITHUB_REF_NAME}"
      - run: dotnet build -c Release
      - run: dotnet test tests/Oconde.Radar.Tests -c Release --no-build -f net8.0
      - run: dotnet test tests/Oconde.Radar.AspNetCore.Tests -c Release --no-build -f net8.0
      - run: dotnet test tests/Oconde.Radar.Logging.Tests -c Release --no-build -f net8.0
      - run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
